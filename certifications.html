<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certifications | Sourabh Gurav</title>
    <meta name="description" content="Certificates completed by Sourabh Gurav, with dates and issuing universities and organizations.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/certificates.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary: #f59e0b;
            --dark: #1e293b;
            --light: #f8fafc;
            --gray: #94a3b8;
            --dark-gray: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Same dark-mode palette as index.html */
        body.dark-mode {
            --light: #7ca2db;
            --dark: #060505;
            background-color: #87e8ef;
        }

        a { text-decoration: none; color: inherit; }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 2.5rem;
            font-weight: 700;
            position: relative;
            display: inline-block;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 60%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        #theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--primary);
            padding: 0 12px;
        }

        #theme-toggle:hover { color: var(--secondary); }

        @media (max-width: 480px) {
            .section-title { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <header class="cert-page-header">
        <div class="container">
            <nav>
                <a href="index.html#certifications" class="cert-back">
                    <i class="fas fa-arrow-left"></i>Back to portfolio
                </a>
                <button id="theme-toggle" aria-label="Toggle dark mode">
                    <i class="fas fa-moon"></i>
                </button>
            </nav>
        </div>
    </header>

    <main class="cert-page">
        <div class="container">
            <h1 class="section-title">Certifications</h1>
            <p class="cert-intro">
                Courses and professional certificates I have completed, with the issuing
                university or organization and when I finished them.
            </p>

            <div class="cert-toolbar">
                <input id="cert-search" type="search" placeholder="Search by name or skill..." aria-label="Search certificates">
                <select id="cert-filter" aria-label="Filter by organization"></select>
            </div>
            <p id="cert-summary" class="cert-summary"></p>

            <div id="cert-list" class="cert-grid"></div>
        </div>
    </main>

    <script src="js/certificates-data.js"></script>
    <script src="js/certificates.js"></script>
    <script src="js/theme.js"></script>
</body>
</html>
