<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certifications · Sourabh Gurav</title>
    <meta name="description" content="Certificates completed by Sourabh Gurav, with completion dates and issuing universities and organizations.">
    <link rel="canonical" href="https://sougur.github.io/certifications.html">
    <link rel="icon" href="images/sourabh.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/certificates.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Same design tokens as index.html */
        :root {
            --bg: #ffffff;
            --bg-alt: #f6f8fb;
            --surface: #ffffff;
            --border: #e3e8ef;
            --text: #0f172a;
            --text-muted: #475569;
            --text-soft: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-soft: #eff4ff;
            --accent-text: #1e40af;
            --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.06);
            --radius: 12px;
            --nav-bg: rgba(255, 255, 255, 0.9);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0b1120; --bg-alt: #0f172a; --surface: #131c31; --border: #1f2a44;
                --text: #e6ebf5; --text-muted: #a5b1c7; --text-soft: #8291ab;
                --accent: #60a5fa; --accent-hover: #93c5fd; --accent-soft: #15233f; --accent-text: #93c5fd;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
                --nav-bg: rgba(11, 17, 32, 0.9);
            }
        }
        :root[data-theme="dark"] {
            --bg: #0b1120; --bg-alt: #0f172a; --surface: #131c31; --border: #1f2a44;
            --text: #e6ebf5; --text-muted: #a5b1c7; --text-soft: #8291ab;
            --accent: #60a5fa; --accent-hover: #93c5fd; --accent-soft: #15233f; --accent-text: #93c5fd;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
            --nav-bg: rgba(11, 17, 32, 0.9);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { color: var(--accent-hover); }

        .container { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
        @media (min-width: 640px) { .container { padding: 0 24px; } }

        header {
            position: sticky; top: 0; z-index: 100;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }
        nav { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
        .back { color: var(--text-muted); font-weight: 600; font-size: 0.95rem; display: inline-flex; align-items: center; gap: 8px; }
        .back:hover { color: var(--text); }
        .icon-btn {
            width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-muted); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; font-size: 0.95rem;
        }
        .icon-btn:hover { color: var(--text); }

        main { padding: 56px 0 72px; }
        .eyebrow { color: var(--accent-text); font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; }
        h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); letter-spacing: -0.02em; line-height: 1.2; margin-top: 6px; }
        .intro { color: var(--text-muted); margin: 10px 0 32px; max-width: 640px; }
    </style>
</head>
<body>
<header>
    <div class="container">
        <nav>
            <a href="index.html#certifications" class="back"><i class="fas fa-arrow-left"></i> Back to portfolio</a>
            <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode"><i class="fas fa-moon"></i></button>
        </nav>
    </div>
</header>

<main>
    <div class="container">
        <div class="eyebrow">Certifications</div>
        <h1>Courses &amp; certificates</h1>
        <p class="intro">
            Courses and professional certificates I have completed, with the issuing
            university or organization and when I finished them.
        </p>

        <div class="cert-toolbar">
            <input id="cert-search" type="search" placeholder="Search by name or skill…" aria-label="Search certificates">
            <select id="cert-filter" aria-label="Filter by organization"></select>
        </div>
        <p id="cert-summary" class="cert-summary"></p>

        <div id="cert-list" class="cert-grid"></div>
    </div>
</main>

<script src="js/certificates-data.js"></script>
<script src="js/certificates.js"></script>
<script>
// Theme toggle: same behaviour and storage key as index.html, so the choice carries over.
(function () {
    const root = document.documentElement;
    const icon = document.querySelector('#themeToggle i');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)');
    let saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    if (saved) root.setAttribute('data-theme', saved);

    function isDark() {
        const t = root.getAttribute('data-theme');
        return t ? t === 'dark' : prefersDark.matches;
    }
    function syncIcon() { icon.className = isDark() ? 'fas fa-sun' : 'fas fa-moon'; }
    syncIcon();
    prefersDark.addEventListener('change', syncIcon);

    document.getElementById('themeToggle').addEventListener('click', () => {
        const next = isDark() ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        syncIcon();
    });
})();
</script>
</body>
</html>
